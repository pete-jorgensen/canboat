notes: |-
  Garmin autopilot field record (sub-protocol 5904), Record Type 5: a type-4 value record followed by a
  trailer of Trailer Kind, Trailer Length (bytes), and that many bytes. Trailer Kind 0x37 is a list: an
  entry count, then that many values of the record's data type. Kinds 0x2F and 0x34 carry three values of
  the record's data type, whose roles (range limits, step, default) are not identified. Field Group minus
  10 is the data type, as in the other field records.

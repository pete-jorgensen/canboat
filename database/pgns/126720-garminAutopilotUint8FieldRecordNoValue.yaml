  primaryKey: true
- id: wrapperByte1
  name: Wrapper Byte 1
  type: UINT8
  match: 4
- id: wrapperByte2
  name: Wrapper Byte 2
  type: UINT8
  match: 4
- id: fieldGroup
  name: Field Group
  type: UINT8
  description: Uint8 field record
  match: 14
- id: recordType
  name: Record Type
  type: UINT8
  description: No value
  match: 2
- id: recordByte8
  name: Record Byte 8
  type: UINT8
  description: 0x0A in every field record
- id: field
  name: Field
  type: LOOKUP
  bits: 8
  lookup: GARMIN_AUTOPILOT_FIELD
  primaryKey: true
- id: fieldNamespace
  name: Field Namespace
  type: UINT8
  description: High byte of the 16-bit field identifier
  primaryKey: true
- id: recordByte11
  name: Record Byte 11
  type: UINT8
  description: 0x11 in every field record
- id: valueCount
  name: Value Count
  type: UINT8
  description: 0 in records without a value, 1 in records with one
notes: |-
  Garmin autopilot field record (sub-protocol 5904). Field Group 10..16 carries a value whose data
  type is Field Group minus 10 (0 float, 1 int8, 2 int16, 3 int32, 4 uint8, 5 uint16, 6 uint32);
  Field Group 17 carries no value. The 16-bit field identifier (Field low byte, Field Namespace high
  byte) is the same identifier the scalar frames (Field Group 0..6) use for the same quantity, and
  both carry the same value. The low four bits of Value Size are the value's length in bytes.

pgn: 126720
id: garminGnssPositionErrorAndDop
description: 'Garmin: GNSS Position Error and DOP'
type: Fast
variantOrder: 86
priority: 7
explanation: 'Sent by a Garmin chartplotter that publishes its own GNSS position. This family has no Message ID slot: after the two wrapper bytes (0x04 0x04) the 56-byte body is fourteen little-endian IEEE-754 float32 values. Overall Position Error is the root sum square of the horizontal and vertical errors, and PDOP that of HDOP and VDOP. The three position errors are twice the receiver''s own estimate and saturate at 731.529; the dilutions of precision saturate at 99.99. Values 4-9 and 14 are zero from some senders and filled by others; their meaning is unknown.'

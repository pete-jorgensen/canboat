notes: |-
  Garmin autopilot scalar transport (sub-protocol 5904): one named value per frame. The Field Group
  byte is the value's data type (0 float, 1 int8, 2 int16, 3 int32, 4 uint8, 5 uint16, 6 uint32) and
  the frame length follows from it. The 16-bit field identifier is the Field byte (low) and the Field
  Namespace byte (high); Field Record frames (Field Group 10..17) carry the same identifiers.
  This variant decodes the fields of its type that have no variant of their own.

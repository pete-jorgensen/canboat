explanation: 'Garmin data-sync transport (sub-protocol 2558, wrapper 0x0B 0x0B), sent by the GHC and GPSMAP units: a 32-bit Connection ID followed by one serialized sync message. The Connection ID is chosen per session (one value per device per power-on); a receiver that sees a different Connection ID from the same address treats it as a new connection. Sub-protocol 2557 on the same wrapper is the sync master advertise. The serialized message (type 6, then 07 00 01 00 in every frame seen) is not decoded further.'

pgn: 130829
id: mercuryEngineStatus
description: 'Mercury: Engine Status'
type: Fast
priority: 7
missing:
- Fields
- FieldLengths
- Resolution
explanation: Per-engine capability-advertisement beacon sent by the Mercury VesselView-Link gateway (one source address per engine). The last byte is a capability bitmask (bit0 = Beacon enabled, bit1 = Cruise Control capability); when bit1 is set the device also emits the Cruise Control PGN 130824. Byte 3 carries the Helm and Sub Helm station addresses for Mercury multi-helm installations.
fields:
- id: manufacturerCode
  name: Manufacturer Code
  type: LOOKUP
  bits: 11
  description: Mercury Marine
  match: 144
  lookup: MANUFACTURER_CODE
- id: reserved
  name: Reserved
  type: RESERVED
  bits: 2
- id: industryCode
  name: Industry Code
  type: LOOKUP
  bits: 3
  description: Marine Industry
  match: 4
  lookup: INDUSTRY_CODE
- id: reserved4
  name: Reserved
  type: RESERVED
  bits: 4
- id: reserved5
  name: Reserved
  type: RESERVED
  bits: 4
- id: subHelm
  name: Sub Helm
  type: UNSIGNED_INTEGER
  bits: 4
  description: Helm-station sub-address (Mercury multi-helm); not available (15) on a device that is not a helm
- id: helm
  name: Helm
  type: UNSIGNED_INTEGER
  bits: 4
  description: Helm-station address (Mercury multi-helm); not available (15) on a device that is not a helm
- id: capabilities
  name: Capabilities
  type: BITLOOKUP
  bits: 8
  lookupBits: MERCURY_ENGINE_CAPABILITY
samples:
- raw: "2023-01-01-00:00:00.000,7,130829,2,255,8,a0,05,90,98,00,ff,03,ff"
  expects:
    manufacturerCode: "Mercury Marine"
    industryCode: "Marine Industry"
    subHelm: ~
    helm: ~
    capabilities: ["Beacon", "Cruise Control"]
- raw: "2023-01-01-00:00:00.000,7,130829,8,255,8,c0,05,90,98,00,00,03,ff"
  expects:
    manufacturerCode: "Mercury Marine"
    industryCode: "Marine Industry"
    subHelm: 0
    helm: 0
    capabilities: ["Beacon", "Cruise Control"]

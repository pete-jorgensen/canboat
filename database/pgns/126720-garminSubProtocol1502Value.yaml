explanation: |-
  Garmin sub-protocol 1502, sent by Garmin displays and the autopilot head unit: an id (6 or 12 seen, in
  equal numbers) and one float32 value. Every value seen lies between 0 and 1; id 12 is never 0, id 6 often
  is. What the values are is not identified.

pgn: 65280
id: navicoDeviceStatus
description: 'Navico: Device Status'
type: Single
variantOrder: 7
priority: 7
missing:
- Fields
- FieldLengths
- Resolution
explanation: Low-rate proprietary status broadcast seen from Navico/B&G/Simrad devices (MFDs, autopilots). The first payload byte distinguishes the sender's software platform - NOS-generation devices emit it at about 4 Hz, NEON-generation devices far less often. The next byte is the sender's power state, which steps through 0, 4, 5 at power-up and 5, 6, 0 at power-down; it reads 5 at all other times, which is why it looks constant. It is followed by a 16-bit code that is constant per device.
fields:
- id: manufacturerCode
  name: Manufacturer Code
  type: LOOKUP
  bits: 11
  description: Navico
  match: 275
  lookup: MANUFACTURER_CODE
- id: reserved
  name: Reserved
  type: RESERVED
  bits: 2
- id: industryCode
  name: Industry Code
  type: LOOKUP
  bits: 3
  description: Marine Industry
  match: 4
  lookup: INDUSTRY_CODE
- id: reportType
  name: Report Type
  type: UINT8
  description: 'Tracks the emitting device''s software platform: 4 = NOS, 5 = NEON. NOS devices broadcast this roughly four
    times a second, NEON devices at a much lower rate.'
- id: runState
  name: Run State
  type: UINT8
  description: 'Power state of the sender: 0 while off, 4 for under a second at power-up, 5 while powered, 6 briefly
    at power-down (observed sequences 0, 4, 5 and 5, 6, 0). Constant at 5 in steady traffic.'
- id: reserved6
  name: Reserved
  type: RESERVED
  bits: 8
- id: configCode
  name: Config Code
  type: UINT16
  description: Constant per sending device
- id: reserved8
  name: Reserved
  type: RESERVED
  bits: 8
samples:
- raw: "2023-01-01-00:00:00.000,2,65280,30,255,8,13,99,04,05,00,00,02,00"  # from merrimac-2022.raw
  expects:
    manufacturerCode: "Navico"
    industryCode: "Marine Industry"
    reportType: 4
    runState: 5
    configCode: 512
- raw: "2023-01-01-00:00:00.000,2,65280,32,255,8,13,99,05,00,00,00,00,00"  # from nac3-operations.raw
  expects:
    manufacturerCode: "Navico"
    industryCode: "Marine Industry"
    reportType: 5
    runState: 0
    configCode: 0
- raw: "2023-01-01-00:00:00.000,7,65280,2,255,8,13,99,00,05,00,1d,00,00"
  expects:
    manufacturerCode: "Navico"
    industryCode: "Marine Industry"
    reportType: 0
    runState: 5
    configCode: 29

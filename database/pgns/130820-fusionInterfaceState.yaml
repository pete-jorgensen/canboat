    industryCode: "Marine Industry"
    messageId: "Interface State"
    interface: "Wired"
    state: "Connected"
    ipMode: "DHCP"
    ipAddress1: 192
    ipAddress2: 0
    ipAddress3: 2
    ipAddress4: 179
    netmask1: 255

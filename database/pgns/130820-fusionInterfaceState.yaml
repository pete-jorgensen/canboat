pgn: 130820
id: fusionInterfaceState
description: 'Fusion: Interface State'
type: Fast
variantOrder: 75
priority: 7
fields:
- id: manufacturerCode
  name: Manufacturer Code
  type: LOOKUP
  bits: 11
  description: Fusion Electronics
  match: 419
  lookup: MANUFACTURER_CODE
- id: reserved
  name: Reserved
  type: RESERVED
  bits: 2
- id: industryCode
  name: Industry Code
  type: LOOKUP
  bits: 3
  description: Marine Industry
  match: 4
  lookup: INDUSTRY_CODE
- id: messageId
  name: Message ID
  type: LOOKUP
  bits: 16
  description: Interface State
  match: 16400
  lookup: FUSION_STATUS_MESSAGE_ID
  primaryKey: true
- id: interface
  name: Interface
  type: LOOKUP
  bits: 8
  lookup: FUSION_NETWORK_INTERFACE
  primaryKey: true
- id: state
  name: State
  type: LOOKUP
  bits: 8
  lookup: FUSION_INTERFACE_STATE
- id: ipMode
  name: IP Mode
  type: LOOKUP
  bits: 8
  lookup: FUSION_IP_MODE
- id: ipAddress1
  name: IP Address 1
  type: UINT8
  specialValues: 0
- id: ipAddress2
  name: IP Address 2
  type: UINT8
  specialValues: 0
- id: ipAddress3
  name: IP Address 3
  type: UINT8
  specialValues: 0
- id: ipAddress4
  name: IP Address 4
  type: UINT8
  specialValues: 0
- id: netmask1
  name: Netmask 1
  type: UINT8
  specialValues: 0
- id: netmask2
  name: Netmask 2
  type: UINT8
  specialValues: 0
- id: netmask3
  name: Netmask 3
  type: UINT8
  specialValues: 0
- id: netmask4
  name: Netmask 4
  type: UINT8
  specialValues: 0
- id: gateway1
  name: Gateway 1
  type: UINT8
  specialValues: 0
- id: gateway2
  name: Gateway 2
  type: UINT8
  specialValues: 0
- id: gateway3
  name: Gateway 3
  type: UINT8
  specialValues: 0
- id: gateway4
  name: Gateway 4
  type: UINT8
  specialValues: 0
notes: |-
  Broadcast by the head unit when a network interface changes state. Addresses are IPv4 in network byte order, one field per octet: every octet value is an address byte, so none is reserved.

  Gateway is not always usable: units have reported values outside the interface's subnet
  that differ between messages, as well as zero.

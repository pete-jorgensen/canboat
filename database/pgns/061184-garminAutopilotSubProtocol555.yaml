explanation: |-
  Single-frame Garmin sub-protocol 555, sent by the autopilot computer: one byte that moves by one step at
  a time within a narrow band (0x11 .. 0x20 observed), with a baseline that differs between sessions - a
  slow internal analog reading whose quantity is not identified.

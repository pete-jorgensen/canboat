pgn: 126720
id: garminAutopilotFlaggedUint8Field
description: 'Garmin Autopilot: Flagged Uint8 Field'
type: Fast
variantOrder: 109
priority: 7
missing:
- Fields
- Resolution
explanation: |-
  Garmin autopilot scalar transport (sub-protocol 5904), Field Group 39: a single-value frame whose
  value is one byte, preceded by a 0/1 flag byte. The flag is constant per field, like the Flags byte of
  a field record. Seen for the even fields 80..90 of namespace 0x14.

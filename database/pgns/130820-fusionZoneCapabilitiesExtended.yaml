notes: |-
  Five 8-byte records -- four zone slots and a global slot, in the same order
  as the PGN 130820 "Capabilities" status (message id 32798).

  The layout is confirmed against a message canboat already decodes rather than
  guessed: the leading 16 bits of each record are EXACTLY the corresponding
  word of 32798, which the same unit sent in the same window.

    Capabilities (32798)  Zone 1 0xFDFF  Zone 2 0xBDFF  Zone 3 0xB7FF  Zone 4 0  Global 0
    Extended     (32865)  record 0xFDFF  record 0xBDFF  record 0xB7FF  0000      0000

  Each record is one little-endian 64-bit flag word. The low 16 bits use
  FUSION_CAPABILITY_BITFIELD, as in 32798. The high 48 bits are the Extra field,
  so bit n of Extra is bit n+16 of the word (FUSION_CAPABILITY_EXTENDED_BITFIELD).
  The six Extra bytes of each populated record read 02,00,00,00,00,00 and are
  zero for the unpopulated slots. Bit 17 of the word (the 02) is "has crossover
  type"; the other bits are not established.

  32798 "Capabilities" was separately shown to be static: it is unchanged by
  the "Internal Amps On" setting, verified by requesting a fresh copy with the
  amplifier switched off. It is broadcast on a 5-minute cycle and also answered
  on demand via FUSION_MESSAGE_ID 1 "Request Status".

  Evidence: samples/fusion-zone-capabilities-extended.raw.
